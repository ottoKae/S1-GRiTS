name: py312_s1grits
channels:
  - conda-forge

dependencies:
  # Pinned to 3.12 in lockstep with pyproject.toml requires-python (">=3.12,<3.13").
  # The geoscience stack (GDAL/rasterio/fiona, geopandas, pyproj, shapely) only has
  # reliable conda-forge/wheel builds for this range; newer CPython often lacks them.
  - python=3.12
  - pip

  # Geospatial core (conda-forge binaries; do not use pip for these)
  - rasterio
  - geopandas
  - rioxarray
  - pyproj
  - shapely

  # Array / data stack
  - numpy
  - scipy
  - bottleneck
  - pandas
  - xarray
  - zarr
  - h5py
  - pyarrow

  # Network / ASF access
  - requests
  - urllib3
  - tqdm
  - fsspec
  - asf_search

  # Config / utilities
  - pydantic
  - pyyaml
  - python-dateutil
  - rich
  - psutil
  - tenacity
  - defusedxml
  - pandera

  # Image processing
  - scikit-image
  - pillow
  - matplotlib

  # Notebook support (optional but convenient)
  - ipykernel
  - ipywidgets

  # PyPI package names needed by pyproject.toml.
  - pip:
      - opencv-python>=4.10.0.84

  # NOTE: After creating this environment, install s1grits manually:
  #   pip install -e .   (editable mode, run from project root)
  #   pip install .      (standard install)
