# =============================================================================
# S1-GRiTS Scenes Workflow Configuration
# =============================================================================
# Usage: s1grits process_scenes --config config/s1grits_scenes.yaml
#
# Produces per-pass tile mosaics as the primary product, with optional
# monthly compositing controlled by processing.monthly.enabled.
#
# Output structure:
#   {base_dir}/
#     {TILE}/
#       catalog.parquet
#       scenes_{DESPECKLE}_{BANDS}/zarr/s1grits_scenes_{TILE}_{DIR}_TK{tk}_N{nn}.zarr
#       scenes_{DESPECKLE}_{BANDS}/cog/{TILE}_{DIR}_{ACQDT}.tif
#       scenes_{DESPECKLE}_{BANDS}/preview/{TILE}_{DIR}_{ACQDT}.png
#       smonthly_{DESPECKLE}_{BANDS}/                                       (if monthly.enabled)
#         zarr/s1grits_smonthly_{TILE}_{DIR}_TK{tk}_N{nn}.zarr   (one per track)
#         cog/s1grits_smonthly_{TILE}_{DIR}_TK{tk}_N{nn}_{YYYY-MM}.tif
#         preview/s1grits_smonthly_{TILE}_{DIR}_TK{tk}_N{nn}_{YYYY-MM}.png
#   catalog.parquet
#   (STAC is produced only by `s1grits catalog resync`, under collections/)
# =============================================================================

# Workflow type (validated by CLI)
workflow: "scenes"

# ---------------------------------------------------------------------------
# Metadata — product registry reference
# ---------------------------------------------------------------------------
metadata:
  # Path to product registry YAML (relative to project root or absolute)
  # Defines collection_id, bands, array_dims for each product_type.
  # If omitted, defaults to config/s1grits_products.yaml then built-in.
  product_config: config/s1grits_products.yaml

# =============================================================================
# ROI CONFIGURATION — tile selection
#   Pick one mode (comment out the other):
#
#   Mode A [wkt]    — polygon geometry, tiles auto-detected from overlap
#   Mode B [manual] — explicit tile list, faster startup
#
#   Both modes work with time Mode A (full) and Mode B (years)
# =============================================================================
roi:
  # --- Mode A: WKT polygon (EPSG:4326) ---
  # wkt: "POLYGON((...))"
  # wkt: "POLYGON((112.3586 21.4611,113.9688 21.8093,114.3066 22.0441,115.0278 22.5527,115.0934 22.6332,115.4216 23.2375,115.4192 23.2462,115.3899 23.2907,115.303 23.3625,114.265 23.9628,112.2853 24.3922,111.8728 24.2319,111.4818 23.6292,111.3944 23.4718,111.3877 23.4507,111.3584 23.3429,111.3567 23.3327,111.3573 23.3263,112.3574 21.4618,112.3586 21.4611))"

  # --- Mode B: Manual tile list ---
  manual_mgrs_tiles:
    # - "50RKV"
    # - "17MPU"
    # - "46SEG"
    - "17MQV"
    - "17MPU"

  # Orbit direction (process one direction at a time)
  # flight_direction: "DESCENDING"
  flight_direction: "ASCENDING"

  polarization: "VV+VH"

  # Tile-coverage filter (query stage): drop whole acquisition tracks whose
  # burst footprint covers less than this fraction of the MGRS tile. Saves
  # download + compute on tracks that only clip a small corner of the tile.
  # 0.0 disables the filter. 0.20 (= 20%) recommended for OPERA RTC-S1.
  min_tile_coverage_frac: 0.20

# =============================================================================
# TIME CONFIGURATION
#   Pick one mode (comment out the other):
#
#   Mode A [full]  — auto-detect earliest data, process to end_year-12-31
#   Mode B [years] — process specific years / months
# =============================================================================
time:
  # --- Mode A: Full archive ---
  # full: 2026

  # --- Mode B: Specific years ---
  years: [2026]
  months: [1]

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================
output:
  base_dir: "../outputs"

  # ---- v3 output policies: store level vs month level, explicitly split ----
  #
  # STORE level — what to do with a whole existing Zarr store:
  #   "resume"               (default, incremental) — adopt the store's locked
  #                          grid as this run's master grid and append. A later
  #                          run over a larger window (pilot month -> full
  #                          year) extends the same store; nothing is deleted.
  #                          An incompatible store (changed CRS/resolution)
  #                          fails with recovery options.
  #   "rebuild-incompatible" — adopt the grid backing the MOST data (or derive
  #                          a fresh burst-union grid on a fresh tile), then
  #                          DELETE + re-create any store incompatible with it
  #                          (e.g. a stray store left by an interrupted run on
  #                          a different grid). Compatible stores are still
  #                          resumed, never wiped.
  existing_store: "resume"

  # MONTH level — when a month ALREADY EXISTS in a (compatible) store:
  #   "skip"      — keep the existing month's composite, do not recompute
  #   "overwrite" — delete that month's time step and rewrite it
  # Applies to smonthly composites; per-acquisition scenes dedup by exact
  # timestamp and are always skipped when already present.
  existing_month: "skip"

  # (Deprecated v2 aliases still accepted with a warning:
  #  overwrite: true  == existing_store: "rebuild-incompatible"
  #  on_time_conflict == existing_month)

  # ========================================================================
  # STAC generation
  # ========================================================================
  # Workflows are CATALOG-ONLY: they write catalog.parquet + data (Zarr/COG/
  # Preview) and NEVER write STAC. Generate STAC afterwards with:
  #     s1grits catalog resync --output-dir <output.base_dir>
  # which builds stac-geoparquet (one collections/{id}/items.parquet for ALL
  # products at once) — a single, consistent STAC representation.
  # ========================================================================

  # Output format toggles (Zarr is always generated — it is the primary Data Cube product)
  formats:
    cog: true        # Optional: per-acquisition GeoTIFF exports
    preview: true    # Optional: PNG visualization exports
    # zarr is NOT listed here — it is always produced regardless

# =============================================================================
# PREFLIGHT CHECKS (run before downloads begin)
# =============================================================================
preflight:
  disk:
    # What to do when free space on the output volume is below min_free_gb:
    #   "warn" (default) — log a warning and continue
    #   "fail"           — abort the run before any download starts
    #   "off"            — skip the check
    mode: "warn"
    min_free_gb: 50

# =============================================================================
# QUERY ROBUSTNESS (ASF CMR metadata search)
#   ASF's CMR endpoint can be slow/flaky (especially behind a VPN). These make
#   the metadata query more tolerant of timeouts.
# =============================================================================
query:
  cmr_timeout_seconds: 90      # per-request timeout (asf_search default is 30)
  max_retries: 3               # retry each time-range chunk this many times
  retry_backoff_seconds: 5     # base backoff; waits 5s, 10s, 20s, … between tries
  # Parallel CMR burst subqueries. 1 = serial single call (default). Higher
  # values split the tile's burst-ID list into that many chunks and query CMR
  # concurrently; the merged result is identical to the serial call (bursts are
  # independent; dedup + sort are deterministic). 4 is a good, polite value.
  max_workers: 4
  # Look back this many months (metadata only, no download) to establish each
  # track's TRUE burst footprint, so interior-gap detection works even when the
  # processed window is short (e.g. a single month). 0 disables.
  footprint_lookback_months: 0  # DISABLED - reduces ASF queries, metadata complexity
  # The look-back result is cached on disk per tile (.footprint_lookback.json).
  # A re-run over the same window within this many days reuses the cache and
  # skips the extra ASF metadata query. Set 0 to always re-query.
  footprint_cache_ttl_days: 7

# 
# =============================================================================
# PARALLEL PROCESSING
# =============================================================================
parallel:
  enabled: true
  # Tile-level worker processes (ProcessPoolExecutor). An integer is used as-is;
  # "auto" sizes the pool from CPU cores and available RAM / the blockwise
  # per-tile working set (~12 GB), floored at 1 and capped at 8. Blockwise
  # sizing means a big-RAM box gets more workers than the old full-tile
  # heuristic allowed. Manual guide: 2 for <=16GB, 4 for 32GB, 6-8 for >=64GB.
  #
  # Concurrency model (three cooperating pools; keep the product in mind):
  #   * parallel.max_workers        — processes, one MGRS tile each
  #   * monthly.blockwise_threads   — threads PER tile worker for block writes
  #       -> effective CPU threads ~= max_workers * blockwise_threads
  #   * memory.max_download_workers — HTTP connections PER tile worker
  #       -> effective ASF connections ~= max_workers * max_download_workers,
  #          bounded by a global 16-connection budget when set to "auto"
  # BLAS/GDAL/OMP stay single-threaded (see the runtime section), so these pools
  # do not oversubscribe through nested library parallelism.
  max_workers: 2

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================
memory:
  # Maximum memory (GB): 'auto' (detect from the machine via psutil) or a number.
  max_memory_gb: 'auto'
  # Batch strategy: 'auto', 'yearly', 'quarterly', 'monthly'. Controls how many
  # months of scenes are held in memory per tile at once. With 'auto', the
  # estimator is blockwise-aware: the blockwise smonthly writer holds only a
  # burst-footprint working set (~1/4 of a full-tile stack), so a large-RAM box
  # is allowed a bigger batch than the old full-tile heuristic. When a spatial
  # neighbourhood filter forces the legacy full-array scenes path (despeckle),
  # the batch is capped at quarterly to bound peak RSS.
  batch_strategy: 'quarterly'
  # Parallel ASF download connections per tile worker. An integer is used
  # as-is; "auto" divides a global 16-connection budget across the tile-level
  # worker pool (parallel.max_workers), floored at 4 and capped at 8, to stay
  # polite to ASF's CDN while keeping the pipe full. Downloads already stream
  # in 1 MiB chunks.
  max_download_workers: 4
  # Optional on-disk cache for downloaded burst GeoTIFFs, keyed by URL. When
  # set to a directory, bursts shared between adjacent MGRS tiles (and re-runs)
  # are downloaded once and reused from disk. null (default) disables it, so
  # the download path is byte-for-byte unchanged. Entries are sha256-validated;
  # the directory can be deleted at any time to reclaim space. Recommended for
  # multi-tile ROIs or repeated runs over the same area, where the same burst
  # feeds several tiles; not useful for a single one-shot tile. Point it at fast
  # local storage with room for the working set of bursts.
  burst_cache_dir: null
  clear_cache_per_batch: true
  batch_max_retries: 2
  scene_max_retries: 3
  # Maximum allowed failed scene ratio (0.0 = zero tolerance)
  # Relaxed to 0.1 to tolerate occasional network failures
  max_failed_ratio: 0.1
  scene_retry_timeout_seconds: 600.0

# =============================================================================
# RUNTIME RESOURCE LIMITS
# =============================================================================
runtime:
  # Applies per-process GDAL cache and thread limits before worker processes
  # start. Keep these conservative for high ProcessPoolExecutor parallelism.
  enabled: true
  gdal_cachemax_mb: 512
  gdal_num_threads: 1
  omp_num_threads: 1
  openblas_num_threads: 1
  mkl_num_threads: 1
  blis_num_threads: 1
  veclib_maximum_threads: 1
  numexpr_num_threads: 1

# =============================================================================
# PROCESSING CONFIGURATION
# =============================================================================
processing:
  # TV despeckle toggle
  # true  -> suffix _tvbregmanX, despeckle applied
  # false -> no despeckle, output suffix is cleaner
  # Despeckle is a spatial-window (neighbourhood) filter. It runs on the full
  # burst-union mosaic BEFORE the MGRS tile clip (support-before-clip), so tile-
  # edge pixels are filtered with real beyond-tile neighbours and no artificial
  # tile-boundary artifact is introduced.
  # IMPORTANT: despeckle is applied ONLY in the per-acquisition scenes writer.
  # The smonthly monthly composite is built from RAW (non-despeckled) scenes and
  # is never despeckled — enabling this flag does NOT despeckle smonthly, and a
  # separate future feature would be required to add monthly despeckling. Because
  # smonthly is unaffected, enabling despeckle does NOT push smonthly onto the
  # slower legacy full-array path (smonthly still uses the fast blockwise Zarr
  # writer). It does cap the batch strategy at quarterly for the memory-heavier
  # legacy despeckle path in the scenes writer.
  spatial_despeckle: false

  # Optional derived bands (default: false — 2-band VV_dB + VH_dB only)
  features_ratio: false         # Ratio = VH/VV  (per-pixel, no spatial window)
  features_rvi: false          # RVI = 4*VH/(VV+VH)  (per-pixel, no spatial window)
  # GLCM texture bands (contrast/homogeneity/entropy/correlation on VV & VH).
  # GLCM is a spatial-window operation: it is computed on the larger burst-union
  # mosaic and, in the blockwise smonthly writer, on a halo-expanded window per
  # Zarr block, then cropped and tile-clipped LAST. This makes the blockwise
  # result bit-identical to full-mosaic GLCM while avoiding both tile-boundary
  # and block-boundary artifacts. Enabling it does not force the legacy path.
  features_glcm: false

  # Clip output to MGRS tile boundary. This is deliberately the FINAL step, after
  # despeckle and GLCM, so spatial-window operations always run on the larger
  # burst-union support region first (recommended: true).
  tile_clip: true

  # Target resolution in meters
  target_resolution: 30.0

  # Zarr chunk size (y x x pixels per chunk)
  zarr_chunks:
    y: 1024
    x: 1024

  # COG internal tile block size
  cog_block_size: 512

  # Despeckle algorithm (only used when spatial_despeckle=true)
  despeckle:
    method: "tv_bregman"
    kwargs:
      reg_param: 5.0

  # NOTE: on_time_conflict lives under `output:`, not here. A processing-level
  # on_time_conflict key is ignored by the code (the workflow warns if found).

  # Incomplete-acquisition policy. Normal "edge truncation" (a data-take ending
  # a burst or two short along-track) is ALWAYS kept — only an INTERIOR NoData
  # hole (a burst missing in the middle of the tile, enclosed by data) is acted
  # on:
  #   "skip"  (default) — do NOT write that acquisition's tile; record it in
  #                       {TILE}/processing_report.json with a cause label
  #                       (NETWORK / ASF_MISSING_RECENT / ASF_MISSING_STALE) and
  #                       a recoverability note. The next incremental run
  #                       (overwrite=false) re-attempts it.
  #   "write"           — write the scene anyway (keeps the hole).
  #   "abort"           — raise and stop the run.
  incomplete_acquisition: "skip"

  # An interior NoData hole is flagged when it exceeds this fraction of the tile
  # (filters out tiny speckle gaps; a missing burst is far larger).
  interior_hole_max_frac: 0.10

  # ===========================================================================
  # Monthly compositing (optional)
  # Set enabled=false to produce only per-pass scenes output
  # ===========================================================================
  monthly:
    enabled: true

    # If true, run acquisition QC and write only smonthly products.
    # scenes_*/ outputs are not written. Requires enabled=true.
    only: true

    # Composite method: "nanmedian" (recommended)
    composite_method: "nanmedian"

    # Whether to generate COG files
    # Note: With blockwise Zarr path (when features_glcm=false), COG/Preview
    # are generated post-hoc from Zarr, allowing memory-efficient processing
    # with full output format support.
    generate_cog: true

    # Whether to generate PNG previews
    generate_preview: true

    # Blockwise Zarr write parallelism (smonthly, non-GLCM path only).
    # Spatial blocks are Zarr-chunk-aligned, so they are composited and
    # written on a small thread pool with no change to output. Each tile
    # worker (see parallel.max_workers) spawns this many block threads, so
    # the effective thread count is parallel.max_workers * blockwise_threads.
    #   1      : serial block loop (default, safest — no extra CPU contention)
    #   4      : good on an idle box with spare cores (measured speedup plateau)
    #   "auto" : divide CPU cores across the tile-worker pool (capped at 4,
    #            the benchmarked plateau; an explicit larger int can exceed it)
    # BLAS/GDAL stay single-threaded (see runtime limits), so these threads
    # do not oversubscribe through nested parallelism.
    blockwise_threads: 1

# =============================================================================
# LOGGING
# =============================================================================
logging:
  file_level: 'DEBUG'
  console_level: 'INFO'  # Changed from WARNING to see download progress
  suppress_third_party: true
  log_file: './logs/s1grits_scenes_{timestamp}.log'
