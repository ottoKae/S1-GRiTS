# =============================================================================
# S1-GRiTS Scenes Workflow Configuration
# =============================================================================
# Usage: s1grits process_scenes --config config/s1grits_scenes.yaml
#
# Produces per-pass tile mosaics as the primary product, with optional
# monthly compositing controlled by processing.monthly.enabled.
#
# Output structure:
#   {base_dir}/
#     {TILE}/
#       catalog.parquet
#       scenes_{DESPECKLE}_{BANDS}/zarr/s1grits_scenes_{TILE}_{DIR}_TK{tk}_N{nn}.zarr
#       scenes_{DESPECKLE}_{BANDS}/cog/{TILE}_{DIR}_{ACQDT}.tif
#       scenes_{DESPECKLE}_{BANDS}/preview/{TILE}_{DIR}_{ACQDT}.png
#       smonthly_{DESPECKLE}_{BANDS}/                                       (if monthly.enabled)
#         zarr/s1grits_smonthly_{TILE}_{DIR}_TK{tk}_N{nn}.zarr   (one per track)
#         cog/s1grits_smonthly_{TILE}_{DIR}_TK{tk}_N{nn}_{YYYY-MM}.tif
#         preview/s1grits_smonthly_{TILE}_{DIR}_TK{tk}_N{nn}_{YYYY-MM}.png
#   catalog.parquet
#   (STAC is produced only by `s1grits catalog resync`, under collections/)
# =============================================================================

# Workflow type (validated by CLI)
workflow: "scenes"

# ---------------------------------------------------------------------------
# Metadata — product registry reference
# ---------------------------------------------------------------------------
metadata:
  # Path to product registry YAML (relative to project root or absolute)
  # Defines collection_id, bands, array_dims for each product_type.
  # If omitted, defaults to config/s1grits_products.yaml then built-in.
  product_config: config/s1grits_products.yaml

# =============================================================================
# ROI CONFIGURATION — tile selection
#   Pick one mode (comment out the other):
#
#   Mode A [wkt]    — polygon geometry, tiles auto-detected from overlap
#   Mode B [manual] — explicit tile list, faster startup
#
#   Both modes work with time Mode A (full) and Mode B (years)
# =============================================================================
roi:
  # --- Mode A: WKT polygon (EPSG:4326) ---
  # wkt: "POLYGON((...))"
  # wkt: "POLYGON((112.3586 21.4611,113.9688 21.8093,114.3066 22.0441,115.0278 22.5527,115.0934 22.6332,115.4216 23.2375,115.4192 23.2462,115.3899 23.2907,115.303 23.3625,114.265 23.9628,112.2853 24.3922,111.8728 24.2319,111.4818 23.6292,111.3944 23.4718,111.3877 23.4507,111.3584 23.3429,111.3567 23.3327,111.3573 23.3263,112.3574 21.4618,112.3586 21.4611))"

  # --- Mode B: Manual tile list ---
  manual_mgrs_tiles:
    # - "50RKV"
    # - "17MPU"
    - "46SEG"
    # - "17MQV"

  # Orbit direction (process one direction at a time)
  # flight_direction: "DESCENDING"
  flight_direction: "ASCENDING"

  polarization: "VV+VH"

  # Tile-coverage filter (query stage): drop whole acquisition tracks whose
  # burst footprint covers less than this fraction of the MGRS tile. Saves
  # download + compute on tracks that only clip a small corner of the tile.
  # 0.0 disables the filter. 0.20 (= 20%) recommended for OPERA RTC-S1.
  min_tile_coverage_frac: 0.20

# =============================================================================
# QUERY ROBUSTNESS (ASF CMR metadata search)
#   ASF's CMR endpoint can be slow/flaky (especially behind a VPN). These make
#   the metadata query more tolerant of timeouts.
# =============================================================================
query:
  cmr_timeout_seconds: 90      # per-request timeout (asf_search default is 30)
  max_retries: 3               # retry each time-range chunk this many times
  retry_backoff_seconds: 5     # base backoff; waits 5s, 10s, 20s, … between tries
  # Look back this many months (metadata only, no download) to establish each
  # track's TRUE burst footprint, so interior-gap detection works even when the
  # processed window is short (e.g. a single month). 0 disables.
  footprint_lookback_months: 6
  # The look-back result is cached on disk per tile (.footprint_lookback.json).
  # A re-run over the same window within this many days reuses the cache and
  # skips the extra ASF metadata query. Set 0 to always re-query.
  footprint_cache_ttl_days: 7

# =============================================================================
# TIME CONFIGURATION
#   Pick one mode (comment out the other):
#
#   Mode A [full]  — auto-detect earliest data, process to end_year-12-31
#   Mode B [years] — process specific years / months
# =============================================================================
time:
  # --- Mode A: Full archive ---
  # full: 2026

  # --- Mode B: Specific years ---
  years: [2026]
  months: [6]

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================
output:
  base_dir: "../outputs"
   # Whether to overwrite existing outputs (false = incremental-safe skip mode)
  overwrite: false

  # On time conflict: "skip" (keep existing) or "overwrite" (replace)
  on_time_conflict: "skip"

  # ========================================================================
  # STAC generation
  # ========================================================================
  # Workflows are CATALOG-ONLY: they write catalog.parquet + data (Zarr/COG/
  # Preview) and NEVER write STAC. Generate STAC afterwards with:
  #     s1grits catalog resync --output-dir <output.base_dir>
  # which builds stac-geoparquet (one collections/{id}/items.parquet for ALL
  # products at once) — a single, consistent STAC representation.
  # ========================================================================

  # Output format toggles (Zarr is always generated — it is the primary Data Cube product)
  formats:
    cog: true        # Optional: per-acquisition GeoTIFF exports
    preview: true    # Optional: PNG visualization exports
    # zarr is NOT listed here — it is always produced regardless

# =============================================================================
# PARALLEL PROCESSING
# =============================================================================
parallel:
  enabled: true
  # Recommended: 2 for <=16GB, 4 for 32GB, 6-8 for >=64GB
  max_workers: 4

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================
memory:
  # Maximum memory (GB): 'auto' or a number
  max_memory_gb: 'auto'
  # Batch strategy: 'auto', 'yearly', 'quarterly', 'monthly'
  batch_strategy: 'auto'
  max_download_workers: 4
  clear_cache_per_batch: true
  batch_max_retries: 2
  scene_max_retries: 3
  # Maximum allowed failed scene ratio (0.0 = zero tolerance)
  max_failed_ratio: 0.0
  scene_retry_timeout_seconds: 600.0

# =============================================================================
# PROCESSING CONFIGURATION
# =============================================================================
processing:
  # TV despeckle toggle
  # true  -> suffix _tvbregmanX, despeckle applied
  # false -> no despeckle, output suffix is cleaner
  spatial_despeckle: false

  # Optional derived bands (default: false — 2-band VV_dB + VH_dB only)
  features_ratio: false         # Ratio = VH/VV
  features_rvi: false          # RVI = 4*VH/(VV+VH)
  features_glcm: false         # GLCM texture bands

  # Clip output to MGRS tile boundary after all processing (recommended: true)
  tile_clip: true

  # Target resolution in meters
  target_resolution: 30.0

  # Zarr chunk size (y x x pixels per chunk)
  zarr_chunks:
    y: 512
    x: 512

  # COG internal tile block size
  cog_block_size: 256

  # Despeckle algorithm (only used when spatial_despeckle=true)
  despeckle:
    method: "tv_bregman"
    kwargs:
      reg_param: 5.0

  # On time conflict: "skip" or "overwrite"
  on_time_conflict: "skip"

  # Incomplete-acquisition policy. Normal "edge truncation" (a data-take ending
  # a burst or two short along-track) is ALWAYS kept — only an INTERIOR NoData
  # hole (a burst missing in the middle of the tile, enclosed by data) is acted
  # on:
  #   "skip"  (default) — do NOT write that acquisition's tile; record it in
  #                       {TILE}/processing_report.json with a cause label
  #                       (NETWORK / ASF_MISSING_RECENT / ASF_MISSING_STALE) and
  #                       a recoverability note. The next incremental run
  #                       (overwrite=false) re-attempts it.
  #   "write"           — write the scene anyway (keeps the hole).
  #   "abort"           — raise and stop the run.
  incomplete_acquisition: "skip"

  # An interior NoData hole is flagged when it exceeds this fraction of the tile
  # (filters out tiny speckle gaps; a missing burst is far larger).
  interior_hole_max_frac: 0.005

  # ===========================================================================
  # Monthly compositing (optional)
  # Set enabled=false to produce only per-pass scenes output
  # ===========================================================================
  monthly:
    enabled: false

    # Composite method: "nanmedian" (recommended)
    composite_method: "nanmedian"

    # Whether to generate COG files
    generate_cog: true

    # Whether to generate PNG previews
    generate_preview: true

# =============================================================================
# LOGGING
# =============================================================================
logging:
  file_level: 'DEBUG'
  console_level: 'WARNING'
  suppress_third_party: true
  log_file: './logs/s1grits_scenes_{timestamp}.log'
