# =============================================================================
# S1-GRiTS Product Registry — EXAMPLE / OVERLAY FILE
# =============================================================================
# The authoritative product definitions ship INSIDE the package
# (s1grits.product_registry.DEFAULT_REGISTRY); this file is a byte-equal
# mirror kept as documentation and as a starting point for custom overlays.
#
# You do NOT need this file. The layered configuration is:
#   1. built-in defaults (always present, wherever s1grits is installed)
#   2. metadata.product_config: path/to/overlay.yaml   (merged per product;
#      declare top-level `replace: true` for wholesale replacement)
#   3. metadata.products: {...} inline in the workflow YAML (merged last —
#      define a fully custom Data Cube in one self-contained config)
#
# DEPRECATED: auto-loading this file from the current working directory
# (removal in v3.0.0). Reference overlays explicitly via metadata.product_config.
#
# Fields per product:
#   collection_id   — STAC collection identity (required for NEW products)
#   time_varying    — true (time-series) or false (static)
#   array_dims      — Zarr dimension layout
#   derived_from    — minimum guaranteed bands (validator checks catalog.bands
#                     includes these; workflow can append additional bands)
#   variant_fields  — workflow config dotted-paths that affect product semantics
#                     (used to compute processing_signature and product_variant)
# =============================================================================

schema_version: 3

products:
  # --- Per-acquisition scenes (workflow_scenes) ---
  scenes:
    collection_id: s1grits-scenes
    time_varying: true
    array_dims: ["time", "y", "x"]
    derived_from: ["VV_dB", "VH_dB"]
    variant_fields:
      - processing.spatial_despeckle
      - processing.despeckle_method
      - processing.despeckle_strength
      - processing.features_ratio
      - processing.features_rvi
      - processing.features_glcm

  # --- Monthly median composites from scenes (workflow_scenes monthly.enabled=true) ---
  smonthly:
    collection_id: s1grits-smonthly
    time_varying: true
    array_dims: ["time", "y", "x"]
    derived_from: ["VV_dB", "VH_dB"]
    variant_fields:
      - processing.spatial_despeckle
      - processing.despeckle_method
      - processing.despeckle_strength
      - processing.features_ratio
      - processing.features_rvi
      - processing.features_glcm
      - processing.monthly.composite_method

  # --- Static geometry layers (workflow_static) ---
  static:
    collection_id: s1grits-static
    time_varying: false
    array_dims: ["y", "x"]
    derived_from:
      - local_inc_angle
    variant_fields:
      - processing.bands

  # --- Legacy monthly composites (workflow.py) ---
  monthly:
    collection_id: s1grits-monthly
    time_varying: true
    array_dims: ["time", "y", "x"]
    derived_from: ["VV_dB", "VH_dB"]
    variant_fields:
      - processing.monthly_despeckle
      - processing.despeckle_method
      - processing.composite_method
      - processing.features_ratio
      - processing.features_rvi
