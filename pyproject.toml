[build-system]
# setuptools>=77 for PEP 639 SPDX license expressions (license = "..." string
# + license-files).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s1grits"
version = "2.3.2"
description = "S1-GRiTS: Sentinel-1 Gridded Radiometrically Terrain-Corrected gamma0 Monthly Composite Time Series"
readme = "README.md"
# Pinned to Python 3.12. The package itself is pure Python, but the geoscience
# dependency stack (GDAL via rasterio/fiona, geopandas, pyproj, shapely) only
# ships reliable binary wheels for a narrow CPython range; 3.13+ frequently has
# no matching wheels yet, so installs fall back to source builds of GDAL and
# fail. Keep this in lockstep with environment.yml (python=3.12). Widen the upper
# bound only after verifying the whole geoscience stack installs on the newer
# interpreter.
requires-python = ">=3.12,<3.13"
# Dual-licensed: PolyForm Noncommercial 1.0.0 for public/noncommercial use;
# commercial licenses available separately (see LICENSE-COMMERCIAL.md).
# Releases before v2.3.0 were Apache-2.0.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSE-COMMERCIAL.md"]
authors = [
    {name = "ottoKae", email = "r1536803768@gmail.com"},
]
maintainers = [
    {name = "ottoKae", email = "r1536803768@gmail.com"},
]
keywords = [
    "sentinel-1",
    "sar",
    "remote-sensing",
    "time-series",
    "geospatial",
    "mgrs",
    "asf",
    "rtc",
    "zarr",
    "cog",
    "monthly-composite",
    "gamma0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

dependencies = [
    # Core scientific computing
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "bottleneck>=1.3.7",
    "pandas>=2.0.0",

    # Geospatial data processing
    "xarray>=2023.1.0",
    "zarr>=3.0.0",
    "rasterio>=1.3.10",
    "rioxarray>=0.15.0",
    "geopandas>=0.14.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",

    # ASF data access
    "asf-search>=7.0.0",
    "requests>=2.31.0",
    "tenacity>=8.0.0",

    # Data and configuration
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9.0",

    # Progress and logging
    "rich>=13.0.0",
    "tqdm>=4.66.0",

    # Image processing (despeckle + preview + visualization).
    # headless build: the code uses only filter2D/warpAffine/imwrite (no GUI),
    # and the GUI-linked opencv-python wheel needs libGL — the classic
    # headless-server install failure.
    "opencv-python-headless>=4.10.0.84",
    "scikit-image>=0.22.0",
    "pillow>=10.0.0",
    "matplotlib>=3.7.0",

    # Data validation
    "pandera>=0.18.0",

    # System utilities
    "psutil>=5.9.0",

    # Security: safe XML parsing
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "ipywidgets>=8.0.0",
]
gui = [
    # Legacy v1.0 Streamlit desktop GUI (superseded by the 'web' extra)
    "streamlit>=1.20.0",
    "streamlit-folium>=0.18.0",
    "folium>=0.16.0",
    "plotly>=5.18.0",
]
web = [
    # v2.3 web UI: `s1grits serve` (see docs/webapp.md)
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
all = [
    "s1grits[dev,notebook,gui,web]",
]

[project.urls]
Homepage = "https://github.com/ottoKae/S1-GRiTS"
Documentation = "https://github.com/ottoKae/S1-GRiTS/blob/main/README.md"
Repository = "https://github.com/ottoKae/S1-GRiTS"
Issues = "https://github.com/ottoKae/S1-GRiTS/issues"

[project.scripts]
s1grits     = "s1grits.cli:main"
s1grits-gui = "s1grits.gui_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"s1grits" = [
    # Static data files
    "data/*.parquet",
    "py.typed",
]
"s1grits.webapp" = [
    # v2.3 web UI frontend (zero-build static SPA)
    "static/*.html",
    "static/*.css",
    "static/*.js",
]
"s1grits.analysis" = ["*.py"]
"gui" = ["*.py"]
"gui.pages" = ["*.py"]
