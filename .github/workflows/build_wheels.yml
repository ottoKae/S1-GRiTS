# Tag-driven release pipeline.
#
# Push one version tag from main:
#   git tag v2.3.0
#   git push origin v2.3.0
#
# Accepted tags:
#   v<major>.<minor>.<patch>          e.g. v2.3.0
#   v<major>.<minor>.<patch>-rc<num>  e.g. v2.4.0-rc1
#
# Python package versions must use PEP 440:
#   v2.3.0      -> 2.3.0
#   v2.4.0-rc1  -> 2.4.0rc1
#
# S1-GRiTS is pure Python. The release artifact is therefore one universal
# py3-none-any wheel plus one source distribution; OS coverage is provided by
# the Linux/macOS/Windows test matrix before publishing.
name: Build Wheels

on:
  push:
    tags:
      # GitHub Actions tag filters are globs, not regexes. The validate-tag job
      # below enforces the exact version-tag regex and fails fast otherwise.
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to GitHub Release and PyPI"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      should-publish: ${{ steps.version.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag, branch ancestry, and package version
        id: version
        shell: bash
        env:
          MANUAL_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual workflow_dispatch run: build/test only unless publish=true."
            TAG="${GITHUB_REF_NAME}"
            SHOULD_PUBLISH="${MANUAL_PUBLISH}"
          else
            TAG="${GITHUB_REF_NAME}"
            SHOULD_PUBLISH="true"
          fi

          if [[ "${SHOULD_PUBLISH}" == "true" ]]; then
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
              echo "::error::Tag '${TAG}' must match vX.Y.Z or vX.Y.Z-rcN"
              exit 1
            fi

            # checkout(fetch-depth: 0) already fetched tags. Fetching --tags
            # again can try to replace checkout's peeled local tag with the
            # annotated remote tag and fail with "would clobber existing tag".
            git fetch origin main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::Release tag ${TAG} must point to a commit reachable from origin/main"
              exit 1
            fi
          fi

          TAG_VERSION="${TAG#v}"
          PEP440_VERSION="${TAG_VERSION/-rc/rc}"
          PYPROJECT_VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          MODULE_VERSION="$(python - <<'PY'
          import pathlib
          ns = {}
          exec(pathlib.Path("src/s1grits/__version__.py").read_text(encoding="utf-8"), ns)
          print(ns["__version__"])
          PY
          )"

          echo "tag=${TAG}"
          echo "tag_version_pep440=${PEP440_VERSION}"
          echo "pyproject=${PYPROJECT_VERSION}"
          echo "__version__=${MODULE_VERSION}"

          if [[ "${SHOULD_PUBLISH}" == "true" ]]; then
            if [[ "${PEP440_VERSION}" != "${PYPROJECT_VERSION}" || "${PEP440_VERSION}" != "${MODULE_VERSION}" ]]; then
              echo "::error::Tag ${TAG} maps to ${PEP440_VERSION}, but pyproject=${PYPROJECT_VERSION} and __version__=${MODULE_VERSION}"
              exit 1
            fi
          fi

          if [[ "${TAG}" == *"-rc"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "package-version=${PYPROJECT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "is-prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "should-publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package from source using binary dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev]"

      - name: Import and CLI smoke test
        run: |
          python -c "import s1grits; print(s1grits.__name__)"
          python -m s1grits --version
          python -m s1grits --help

      - name: Doctor without network
        run: python -m s1grits doctor --config config/s1grits_scenes.yaml

      - name: Run network-free tests
        run: python -m pytest tests/ -q --tb=short

  build:
    name: Build universal wheel and sdist
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert "py3-none-any" in wheels[0].name, wheels[0].name
          print("wheel:", wheels[0])
          print("sdist:", sdists[0])
          PY

      - name: Smoke install built wheel
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -c "import s1grits; from s1grits.__version__ import __version__; print(__version__)"
          python -m s1grits --version

      - uses: actions/upload-artifact@v4
        with:
          name: s1grits-dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [validate-tag, build]
    if: needs.validate-tag.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s1grits-dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          name: S1-GRiTS ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.validate-tag.outputs.is-prerelease == 'true' }}

  publish-pypi:
    name: Publish to PyPI
    needs: [validate-tag, build, github-release]
    if: needs.validate-tag.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s1grits-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
