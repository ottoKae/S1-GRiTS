# CI: lint + type gate, then the same network-free test suite (with coverage)
# on every OS users run S1-GRiTS on.
#
# Strategy (minimal-reliable first):
#   * pip-only install — every runtime dependency (rasterio, geopandas,
#     pyproj, shapely, zarr, opencv-python-headless, ...) ships binary wheels
#     for CPython 3.12 on linux/macos/windows, so no conda is needed for CI.
#   * osgeo/GDAL python bindings are deliberately NOT installed: they have no
#     pip wheels. The mosaic commands guard the import with an actionable
#     error, and `s1grits doctor` reports osgeo as a WARN, not a failure.
#   * All three OSes are REQUIRED checks: the informational period is over —
#     the matrix has been green across many consecutive runs, so a real
#     Windows/macOS regression must block a merge, not pass silently.
#   * Triggers are deduplicated: pull_request covers PR branches, push covers
#     main only. (Previously push also matched claude/**, so every PR ran the
#     whole matrix twice.)
#
# Lint/type policy lives in pyproject.toml ([tool.ruff], [tool.mypy]); the
# lint job just runs it. Local mirror: `pre-commit install` (see
# .pre-commit-config.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev tools (wheels only)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev]"

      - name: ruff (lint rules from pyproject)
        run: ruff check src tests tools benchmarks

      - name: mypy (typed-module allowlist from pyproject)
        run: mypy

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (wheels only — fail loudly on source builds)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev]"

      - name: Import + CLI smoke
        run: |
          python -c "import s1grits; print(s1grits.__name__)"
          python -m s1grits --version
          python -m s1grits --help

      - name: Doctor (env + template config validation, no network)
        run: python -m s1grits doctor --config config/s1grits_scenes.yaml

      - name: Run network-free test suite (with coverage report)
        run: python -m pytest tests/ -q --tb=short --cov=s1grits --cov-report=term-missing:skip-covered
