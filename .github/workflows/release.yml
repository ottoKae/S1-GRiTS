# Release pipeline: tag -> test -> build -> publish.
#
# Trigger: pushing a version tag (v2.3.0, v3.0.0, ...). The tag MUST match
# the version in pyproject.toml/__version__.py — the check-version job blocks
# a mismatched release before anything is built.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no long-lived API token in
# repo secrets. ONE-TIME SETUP by the repo owner before the first release:
#   1. On PyPI: project "s1grits" -> Settings -> Publishing -> add GitHub
#      publisher (owner: ottoKae, repo: S1-GRiTS, workflow: release.yml,
#      environment: pypi).
#   2. On GitHub: Settings -> Environments -> create "pypi" (optionally with
#      required reviewers, which adds a manual approval gate to releases).
#
# The package is pure Python -> one universal wheel + sdist; no cibuildwheel
# or per-platform builds needed. Platform coverage is CI's job (ci.yml), not
# the release build's.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must equal the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MOD=$(python -c "import re;print(re.search(r'\"(.+?)\"',open('src/s1grits/__version__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PKG __version__=$MOD"
          test "$TAG" = "$PKG" && test "$TAG" = "$MOD" || {
            echo "::error::tag v$TAG does not match package version ($PKG / $MOD)"; exit 1; }

  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev]"
      - run: python -m pytest tests/ -q --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build                       # sdist + universal wheel
          twine check --strict dist/*
      - name: Smoke-install the built wheel
        run: |
          pip install dist/*.whl
          python -c "import s1grits; from s1grits.__version__ import __version__; print(__version__)"
          python -m s1grits --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # gate: create this environment on GitHub
    permissions:
      id-token: write          # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
