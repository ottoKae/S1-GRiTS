# Legacy release entrypoint.
#
# Tag-driven releases are handled by build_wheels.yml:
#   validate tag -> test Linux/macOS/Windows -> build wheel/sdist
#   -> GitHub Release -> PyPI Trusted Publishing
#
# This manual-only workflow exists to avoid a second tag-triggered publisher
# while leaving a clear pointer for maintainers who look for release.yml.
name: Release (legacy pointer)

on:
  workflow_dispatch:

jobs:
  pointer:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Use .github/workflows/build_wheels.yml for tag-driven releases."
          echo "Example:"
          echo "  git tag v2.3.0"
          echo "  git push origin v2.3.0"
